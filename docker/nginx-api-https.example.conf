# HTTPS for https://api.bibliotecaiceb.ddns.net → Spring Boot on http://127.0.0.1:8080
#
# 1) Copy to the host (adjust server_name if your API host differs):
#      sudo cp docker/nginx-api-https.example.conf /etc/nginx/sites-available/api-iceb.conf
#
# 2) Enable and test HTTP first (Certbot will add SSL to this file):
#      sudo ln -sf /etc/nginx/sites-available/api-iceb.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3) Get a certificate (nginx plugin adds listen 443 + ssl lines):
#      sudo apt install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d api.bibliotecaiceb.ddns.net
#
# 4) Firewall: sudo ufw allow 443/tcp
#
# 5) Frontend .env: VITE_API_URL=https://api.bibliotecaiceb.ddns.net
#    Rebuild the web image. Spring CORS must include your SPA origin (https://bibliotecaiceb.ddns.net).

server {
    listen 80;
    listen [::]:80;
    server_name api.bibliotecaiceb.ddns.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

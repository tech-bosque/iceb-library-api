# Active in Docker: hostname "postgres" is the compose service, not localhost on the app container.
# SPRING_DATASOURCE_* env vars in docker-compose still override these if set.
#
# Behind nginx/Caddy terminating HTTPS, trust X-Forwarded-* so redirects and OpenAPI use https://.
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://postgres:5432/iceb-library
spring.datasource.username=tech-bosque
spring.datasource.password=tech@banco@2025!
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
